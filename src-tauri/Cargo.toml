[package]
name = "moyue-reader"
version = "0.1.0"
description = "Moyue desktop Markdown reader"
authors = ["Moyue"]
edition = "2021"

[lib]
name = "moyue_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3.2"
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKFrameInfo", "WKSecurityOrigin", "WKUIDelegate"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
rfd = { version = "0.16", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# macOS 27 rejects stripped proc-macro dylibs with misaligned LINKEDIT tables.
[profile.release.build-override]
strip = false
