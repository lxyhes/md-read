<!doctype html>
<meta charset="utf-8">
<title>剪贴板链接回归检查</title>
<h1>剪贴板链接回归检查</h1>
<pre id="result">检查中</pre>
<p>可在下面直接粘贴原网页内容，检查实际剪贴板转换结果（不保存内容）。</p>
<textarea id="paste" aria-label="粘贴原网页内容"></textarea>
<pre id="actual"></pre>
<script type="module">
import { formatClipboardToMarkdown } from '/src/pasteMarkdown.ts'
const times = ['10:53', '15:29', '24:21', '38:02', '42:42', '01:02:58', '01:11:02', '01:10:58']
const seconds = [653, 929, 1461, 2282, 2562, 3778, 4262, 4258]
const intro = '本视频讲述了直播电商选品的核心逻辑与实战方法。'
const chapters = times.map((time, index) => `<h3><strong>课程章节 <a href="https://b.quark.cn/video?debug=0&amp;fid=lesson#?seek_t=${seconds[index]}">${time}</a></strong></h3><ul><li><strong>主力客群定义与层级</strong><ul><li><strong>第一标签客群</strong>：需求最强烈的用户</li></ul></li></ul>`).join('')
const html = `<div class="markdown-content-wrapper" style="background-color: rgb(18, 18, 18); color: white"><p>${intro}</p>${chapters}</div>`
const text = `${intro}\n\n${times.map((time) => `课程章节 ${time}\n主力客群定义与层级\n第一标签客群：需求最强烈的用户`).join('\n')}`
function check(condition, message) { if (!condition) throw new Error(message) }
try {
  const pasted = formatClipboardToMarkdown(html, text)
  check((pasted.match(/\]\(https:\/\/b\.quark\.cn/g) ?? []).length === 8, '时间链接丢失')
  times.forEach((time, index) => check(pasted.includes(`[${time}](https://b.quark.cn/video?debug=0&fid=lesson#?seek_t=${seconds[index]})`), `${time} 地址丢失`))
  check(pasted.includes('  - **第一标签客群**'), '嵌套列表或加粗丢失')
  const code = formatClipboardToMarkdown('<div style="background-color: #111"><span>const x = 1;</span><br><span>const y = 2;</span></div>', '')
  check(code.includes('```plain'), '真实代码块识别退化')
  document.querySelector('#result').textContent = 'PASS：深色网页的 8 个时间链接、小时格式、嵌套列表、加粗均保留；真实代码块仍正常。'
} catch (error) { document.querySelector('#result').textContent = `FAIL：${error.message}` }
document.querySelector('#paste').addEventListener('paste', event => {
  event.preventDefault()
  const html = event.clipboardData.getData('text/html')
  const text = event.clipboardData.getData('text/plain')
  const source = formatClipboardToMarkdown(html, text)
  const parsed = new DOMParser().parseFromString(html, 'text/html')
  document.querySelector('#actual').textContent = `原始链接：${parsed.querySelectorAll('a[href]').length}；转换后链接：${(source.match(/\]\(https?:\/\//g) ?? []).length}\n${source}`
})
</script>
